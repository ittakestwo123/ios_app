name: QingJian iOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A hung simulator process must not block verification for a later commit.
  group: qingjian-ios-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test with Xcode 26
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Build for iOS Simulator
        run: |
          mkdir -p build
          set -o pipefail
          set +e
          xcodebuild \
            -project QingJian.xcodeproj \
            -scheme QingJian \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build/xcodebuild-build.log
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ]; then
            echo "::error title=xcodebuild::Build failed with exit code $build_status"
            error_lines=$(grep -E "error:|fatal error:" build/xcodebuild-build.log || true)
            if [ -n "$error_lines" ]; then
              while IFS= read -r line; do
                line="${line//'%'/'%25'}"
                line="${line//$'\r'/'%0D'}"
                line="${line//$'\n'/'%0A'}"
                echo "::error title=xcodebuild::$line"
              done <<< "$error_lines"
            fi
            tail -n 30 build/xcodebuild-build.log | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              line="${line//$'\n'/'%0A'}"
              echo "::error title=xcodebuild::$line"
            done
            exit "$build_status"
          fi

      - name: Run XCTest on iOS Simulator
        run: |
          set -o pipefail
          set +e
          xcodebuild \
            -project QingJian.xcodeproj \
            -scheme QingJian \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/QingJian-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee build/xcodebuild-test.log
          test_status=${PIPESTATUS[0]}
          set -e
          if [ "$test_status" -ne 0 ]; then
            echo "::error title=xcodebuild::Tests failed with exit code $test_status"
            test_lines=$(grep -iE "(error:|failed|failing tests|test case|xctassert|executed [0-9]+ test|xcuitest|ui testing|idetestoperations|assertion|testing failed|test suite)" build/xcodebuild-test.log | tail -n 200 || true)
            if [ -n "$test_lines" ]; then
              while IFS= read -r line; do
                line="${line//'%'/'%25'}"
                line="${line//$'\r'/'%0D'}"
                line="${line//$'\n'/'%0A'}"
                echo "::error title=xcodebuild::$line"
              done <<< "$test_lines"
            fi
            tail -n 80 build/xcodebuild-test.log | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              line="${line//$'\n'/'%0A'}"
              echo "::error title=xcodebuild::$line"
            done
            exit "$test_status"
          fi

      - name: Capture simulator visuals
        if: ${{ success() }}
        continue-on-error: true
        timeout-minutes: 8
        run: |
          set -euo pipefail
          app_path="$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name 'QingJian.app' -type d -print -quit)"
          test -n "$app_path"
          mkdir -p build/visuals
          device_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone 17 \(/ {print $2; exit}')"
          test -n "$device_id"
          trap 'xcrun simctl shutdown "$device_id" >/dev/null 2>&1 || true' EXIT
          xcrun simctl shutdown "$device_id" >/dev/null 2>&1 || true
          xcrun simctl erase "$device_id"
          xcrun simctl boot "$device_id" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" "$app_path"
          xcrun simctl launch "$device_id" com.qingjian.app
          sleep 4
          xcrun simctl io "$device_id" screenshot build/visuals/01-onboarding.png
          xcrun simctl terminate "$device_id" com.qingjian.app || true
          xcrun simctl spawn "$device_id" defaults write com.qingjian.app hasCompletedOnboarding -bool YES
          xcrun simctl launch "$device_id" com.qingjian.app
          sleep 4
          xcrun simctl io "$device_id" screenshot build/visuals/02-today.png
          xcrun simctl terminate "$device_id" com.qingjian.app || true
          xcrun simctl launch "$device_id" com.qingjian.app
          xcrun simctl io "$device_id" recordVideo --codec=h264 --force build/visuals/qingjian-launch.mp4 &
          video_pid=$!
          sleep 12
          kill "$video_pid" || true
          wait "$video_pid" || true

      - name: Upload XCTest results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qingjian-xcresults
          path: |
            build/*.xcresult
            build/*.log
            build/visuals/*
          if-no-files-found: warn
