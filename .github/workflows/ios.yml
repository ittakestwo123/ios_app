name: QingJian iOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qingjian-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test with Xcode 26
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Build for iOS Simulator
        run: |
          mkdir -p build
          set -o pipefail
          set +e
          xcodebuild \
            -project QingJian.xcodeproj \
            -scheme QingJian \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build/xcodebuild-build.log
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ]; then
            echo "::error title=xcodebuild::Build failed with exit code $build_status"
            tail -n 30 build/xcodebuild-build.log | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              line="${line//$'\n'/'%0A'}"
              echo "::error title=xcodebuild::$line"
            done
            exit "$build_status"
          fi

      - name: Run XCTest on iOS Simulator
        run: |
          xcodebuild \
            -project QingJian.xcodeproj \
            -scheme QingJian \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/QingJian-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

      - name: Upload XCTest results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qingjian-xcresults
          path: |
            build/*.xcresult
            build/*.log
          if-no-files-found: warn
